    <style>
      :root{

        --skeleton-bg:#f1f5f9;--skeleton-shine:#e2e8f0;
        --card-bg:#fff;--border-color:#e2e8f0;

      .dark{
        --skeleton-bg:#1e293b;--skeleton-shine:#334155;
        --card-bg:#0f172a;--border-color:#334155;
        --column-bg:#1e293b;
      }
      html{background-color:var(--bg-light)}
      html.dark{background-color:var(--bg-dark)}
      body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#1e293b}
      .dark body{color:#f8fafc}
      #root{min-height:100vh}
      .skeleton{background:linear-gradient(90deg,var(--skeleton-bg) 25%,var(--skeleton-shine) 50%,var(--skeleton-bg) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
      @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    </style>

      ]
    }
    </script>
    <script>
      (function () {
        try {
          var token = localStorage.getItem('token');
          var exp = localStorage.getItem('token_expiry');
          if (!token) return;
          if (!exp || Date.now() > parseInt(exp, 10)) return;
          var path = location.pathname;
          if (path === '/' || path === '/login') {
            location.replace('/dashboard' + location.search + location.hash);
          }
        } catch (e) { void e; }
      })();
    </script>
    <script>
      (function() {
        const stored = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = stored || (prefersDark ? 'dark' : 'light');
        
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        
        document.documentElement.style.backgroundColor = theme === 'dark' ? '#0B0F17' : '#ffffff';
      })();
    </script>
